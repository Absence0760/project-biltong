<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Thong Biltong — cartoon cow in a thong">
  <!-- grounding shadow -->
  <ellipse cx="94" cy="178" rx="68" ry="6" fill="#2a1a10" opacity="0.18"/>

  <!-- front-right leg (anchored between the back legs, stepping forward-left through the pivot) -->
  <path d="M88 130 L100 130 L72 172 L60 172 Z" fill="#c9a27a" stroke="#2a1a10" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="66" cy="174" rx="10" ry="5" fill="#2a1a10"/>

  <!-- back-right leg -->
  <rect x="140" y="130" width="14" height="42" rx="5" fill="#c9a27a" stroke="#2a1a10" stroke-width="3"/>
  <ellipse cx="147" cy="174" rx="10" ry="5" fill="#2a1a10"/>

  <!-- front-left leg (stepping out to the left, mid-pivot) -->
  <path d="M46 130 L60 130 L48 172 L34 172 Z" fill="#c9a27a" stroke="#2a1a10" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="41" cy="174" rx="10" ry="5" fill="#2a1a10"/>

  <!-- body -->
  <ellipse cx="100" cy="114" rx="56" ry="32" fill="#c9a27a" stroke="#2a1a10" stroke-width="3"/>

  <!-- belly shading -->
  <ellipse cx="100" cy="128" rx="40" ry="12" fill="#b78857" opacity="0.55"/>

  <!-- back-left leg (far-side leg in perspective — top sits just above the belly curve so it reads as a separate, further-back leg) -->
  <rect x="104" y="138" width="14" height="34" rx="5" fill="#c9a27a" stroke="#2a1a10" stroke-width="3"/>
  <ellipse cx="111" cy="174" rx="10" ry="5" fill="#2a1a10"/>

  <!-- udders (pink bag with two teats; top edge hugs the body's bottom curve at x=123-135 so the udder reads as part of the silhouette) -->
  <path d="M123 143 Q129 142 135 139 Q137 143 134 148 Q129 150 124 148 Q121 143 123 143 Z" fill="#e8a5a0" stroke="#2a1a10" stroke-width="2" stroke-linejoin="round"/>
  <rect x="125.5" y="149" width="3" height="5" rx="1.4" fill="#e8a5a0" stroke="#2a1a10" stroke-width="1.5"/>
  <rect x="130.5" y="149" width="3" height="5" rx="1.4" fill="#e8a5a0" stroke="#2a1a10" stroke-width="1.5"/>

  <!-- butt crack (at the rear, between the cheeks) -->
  <path d="M129 98 Q130 104 129 110" fill="none" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- tail (emerges from the butt crack at the rear, arcs up and out) -->
  <path d="M129 96 Q146 74 164 80 Q176 92 170 104" fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="104" r="5" fill="#2a1a10"/>

  <!-- thong (waistband across the rump, narrow tapering triangle terminating at the body's lower edge) -->
  <path d="M119 108 L139 108 Q133 122 131 136 Q129 140 127 136 Q125 122 119 108 Z" fill="#1a1a1a" stroke="#2a1a10" stroke-width="3" stroke-linejoin="round"/>
  <rect x="104" y="104" width="50" height="7" rx="3" fill="#1a1a1a" stroke="#2a1a10" stroke-width="3"/>
  <!-- thong highlight -->
  <path d="M123 116 Q129 120 135 116" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- head -->
  <ellipse cx="52" cy="76" rx="30" ry="28" fill="#c9a27a" stroke="#2a1a10" stroke-width="3"/>

  <!-- tuft of hair -->
  <path d="M44 50 Q52 40 60 50 Q56 48 52 52 Q48 48 44 50 Z" fill="#2a1a10"/>

  <!-- MAHA hat crown (red baseball cap; front-left bottom sits a few units higher than the back-right, with a straight bottom line) -->
  <path d="M33 54 Q34 26 52 26 Q70 26 71 57 L33 54 Z" fill="#cc0000" stroke="#2a1a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- bill tapering to a point at the crown's front-bottom corner (no vertical seam — top edge is colinear with the rim line extension) -->
  <path d="M33 54 L16 52.7 Q14 54 16 55.3 L33 54 Z" fill="#cc0000" stroke="#2a1a10" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#ffffff">MAHA</text>

  <!-- ears -->
  <ellipse cx="24" cy="72" rx="8" ry="5" transform="rotate(-30 24 72)" fill="#a87a52" stroke="#2a1a10" stroke-width="2"/>
  <ellipse cx="80" cy="72" rx="8" ry="5" transform="rotate(30 80 72)" fill="#a87a52" stroke="#2a1a10" stroke-width="2"/>

  <!-- snout -->
  <ellipse cx="52" cy="88" rx="18" ry="12" fill="#a87a52" stroke="#2a1a10" stroke-width="2.5"/>
  <ellipse cx="46" cy="89" rx="2.2" ry="3" fill="#2a1a10"/>
  <ellipse cx="58" cy="89" rx="2.2" ry="3" fill="#2a1a10"/>

  <!-- eyes with a wink -->
  <circle cx="42" cy="68" r="3" fill="#2a1a10"/>
  <path d="M58 68 Q62 64 66 68" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>

  <!-- eyebrow (tiny attitude) -->
  <path d="M38 60 Q42 58 46 60" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>
</svg>
